<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


        <title>Calculadora</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
        <script src="events.js" defer></script>
    </head>

    <body>

        <input class="calcInput" type="text" id="expresionInput" placeholder="Ingrese una expresión">
        <span class="calcDisplay" id="texto">0</span>

        <div class ="calcButton">

        <button id="boton1">1</button>
        <button id="boton2">2</button>
        <button id="boton3">3</button>
        <button id="botonPotencia">^</button>
        <button id="botonRaiz">√</button>
        <button id="boton4">4</button>
        <button id="boton5">5</button>
        <button id="boton6">6</button>
        <button id="botonMultiplicacion">*</button>
        <button id="botonDivision">/</button>
        <button id="boton7">7</button>
        <button id="boton8">8</button>
        <button id="boton9">9</button>
        <button id="botonSuma">+</button>
        <button id="botonResta">-</button>
        <button id="boton0">0</button>
    

        </div>
    </body>
</html>
